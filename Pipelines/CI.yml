trigger:
  branches:
    include:
    - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  solution: 'CatalogAPI.slnx'

steps:
- checkout: self

# The .NET 8 SDK provides the runtimes required by the net8.0 test projects.
- task: UseDotNet@2
  displayName: 'Install .NET SDK 8 and runtimes'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Use a newer SDK to support the .slnx solution format.
- task: UseDotNet@2
  displayName: 'Install .NET SDK 10'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore dependencies'
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Run tests'
  inputs:
    command: 'test'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-build --no-restore'
    publishTestResults: true
